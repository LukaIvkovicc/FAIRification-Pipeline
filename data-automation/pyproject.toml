[project]
name = "lterlife-etl"
version = "0.1.0"
description = "ETL pipelines for LTER-LIFE (CSV→Parquet, validation, JSON-LD)"
requires-python = ">=3.10"
dependencies = [
  "pandas",
  "pyarrow",
  "pandera",
  "rapidfuzz",
  "pyyaml"
]

[project.optional-dependencies]
dev = [
  "pytest",
  "flake8",
  "black",
  "isort"
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["etl*"]
